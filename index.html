<!DOCTYPE html>
<html lang="vi">
<head>f
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bắp Học Bài Nè</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#6a4a62;--soft:#b190a8;--pink:#ffc2d9;--pink2:#ff9fc0;--mint:#c5ecd9;--sky:#bde0fe;--lemon:#fff1b8;--card:rgba(255,255,255,.88);--line:#f6d9e5;--bad:#c0334f;--badbg:#ffd0da}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Mali','Quicksand',system-ui,sans-serif;color:var(--ink);background:#fff3f7;position:relative}
body::before{content:"";position:fixed;inset:0;background:var(--bgimg) 0 0/600px auto repeat;z-index:-2}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.stk{position:absolute;pointer-events:none;user-select:none}
.head{position:relative;padding-right:110px;min-height:110px}
h1{font-size:1.7rem;margin:10px 0 2px}
.sub{color:var(--soft);margin:0 0 12px}
.duck{right:0;top:0;width:104px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
nav button,.btn{font:inherit;border:0;border-radius:999px;padding:9px 18px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
nav button.on,.btn.main{background:var(--pink);color:#5b2a46;font-weight:700;box-shadow:0 3px 0 #f2a5c3}
.btn.sm{padding:5px 12px;font-size:.85rem}
.card{position:relative;background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 3px 0 var(--line);border:2px solid #fff}
.ic{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:6px}
/* week */
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{font:inherit;border:2px solid transparent;background:#fff;border-radius:18px;padding:8px 2px;text-align:center;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--line);position:relative}
.day small{display:block;color:var(--soft)}
.day b{font-size:1.2rem;display:block}
.day.today{background:var(--lemon)}
.day.sel{border-color:var(--pink2)}
.day .mini{height:6px;background:var(--line);border-radius:9px;margin:6px 8px 0;overflow:hidden}
.day .mini i{display:block;height:100%;background:#8fd9b6}
.day .star{position:absolute;top:-10px;right:-4px;width:22px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;margin:7px 0;background:#fff7fa;border:2px dashed var(--line)}
.task input{width:24px;height:24px;accent-color:#f78fb3;flex:none}
.task.done span{text-decoration:line-through;opacity:.5}
.task small{display:block;color:var(--soft)}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#8fd9b6;border-radius:99px;transition:width .4s}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#fff7fa;margin:7px 0}
.lesson.done{background:#e3f6ec;border:2px solid #8fd9b6}
.lesson small{display:block;color:var(--soft);margin-top:2px}
.hide{display:none!important}
input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);margin:4px 0 10px}
label{font-size:.9rem;color:var(--soft)}
/* typing */
#stage{position:relative;border-radius:28px;padding:22px;min-height:430px;background:var(--lemon) center/cover no-repeat;overflow:hidden;border:3px solid #fff}
#stage .veil{position:absolute;inset:0;background:rgba(255,255,255,.4);pointer-events:none}
#stage>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.clock{font-size:2rem;font-weight:700;background:rgba(255,255,255,.8);border-radius:18px;padding:2px 16px}
#text{font-size:1.7rem;line-height:2.2;margin:18px 0;word-break:break-word;background:rgba(255,255,255,.4);border-radius:18px;padding:10px 14px}
#text span{opacity:.28;transition:opacity .15s}
#text span.ok{opacity:1;font-weight:700}
#text span.bad{opacity:1;font-weight:700;background:var(--badbg);color:var(--bad);border-radius:6px}
#text span.cur{border-bottom:3px solid #f78fb3;opacity:.7}
#inp{position:absolute;opacity:0;pointer-events:none;height:1px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.res div{background:#fff7fa;border-radius:18px;padding:12px;text-align:center}
.res b{display:block;font-size:1.8rem}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.cols div{flex:1;background:var(--pink);border-radius:8px 8px 2px 2px;min-height:3px}
.up{color:#2f9e6e;font-weight:700}.down{color:#d6546e;font-weight:700}
.deco1{left:-26px;bottom:-6px;width:90px;opacity:.95;position:fixed}
.deco2{right:-8px;bottom:-4px;width:84px;position:fixed}
@media(max-width:560px){body::before{background-size:380px auto}#text{font-size:1.35rem}.head{padding-right:84px}.duck{width:80px}.days{gap:3px}.day b{font-size:1rem}.day small{font-size:.7rem}.deco1,.deco2{width:56px}}
</style>
</head>

<img class="stk deco1" data-img="bear" alt="">
<img class="stk deco2" data-img="cloud" alt="">
<div class="wrap">
  <div class="head">
    <h1 id="title">Bắp học bài nè</h1>
    <p class="sub" id="today"></p>
    <p class="sub" id="sync" style="font-size:.8rem;margin:-6px 0 8px"></p>
    <img class="stk duck" data-img="duck" alt="">
  </div>
  <nav>
    <button data-v="home" class="on">˚₊‧꒰ა Lịch tuần ໒꒱ ‧₊˚</button>
    <button data-v="type">𑣲⋆ Luyện typing ⋆𑣲</button>
    <button data-v="stats">𝄞⨾𓍢ִ໋ Tiến bộ 𝄞⨾𓍢ִ໋</button>
    <button data-v="admin">𝄞⨾𓍢ִ໋ Mẹ Chan 𝄞⨾𓍢ִ໋</button>
  </nav>

  <section id="v-home">
    <div class="card">
      <div class="wk"><button class="btn sm" id="pw">‹ Tuần trước</button><b id="wlabel"></b><button class="btn sm" id="nw">Tuần sau ›</button></div>
      <div class="days" id="days"></div>
    </div>
    <div class="card">
      <img class="stk" data-img="star" alt="" style="width:46px;right:14px;top:-14px">
      <b id="dtitle" style="font-size:1.15rem"></b>
      <div class="bar" style="margin:10px 0 4px"><i id="pbar" style="width:0"></i></div>
      <small id="pct" class="sub"></small>
      <div id="list"></div>
    </div>
  </section>

  <section id="v-type" class="hide">
    <div id="pick">
      <div class="card"><img class="ic" data-img="strawberry" alt=""><b>Mục tiêu hôm nay: <span id="goaltxt">15</span> phút</b>
        <div class="bar" style="margin-top:8px"><i id="tbar" style="width:0"></i></div>
        <small id="tmin" class="sub"></small></div>
      <div class="card"><img class="ic" data-img="candy" alt=""><b>Chọn bài để luyện typing</b><div id="lessons"></div></div>
    </div>
    <div id="play" class="hide">
      <div id="stage"><div class="veil"></div>
        <div class="top"><button class="btn sm" id="back">← Chọn bài khác</button><div class="clock" id="clock">00:00</div><button class="btn sm main" id="stop">Xong bài</button></div>
        <div id="text"></div>
        <small>°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*:･</small>
        <textarea id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
      <audio id="aud" loop></audio>
    </div>
    <div id="result" class="card hide"></div>
  </section>

  <section id="v-stats" class="hide">
    <div class="card"><div class="top"><b><img class="ic" data-img="sunflower" alt=""><span id="ptitle"></span></b>
      <span><button class="btn sm main" data-p="7">Tuần</button> <button class="btn sm" data-p="30">Tháng</button></span></div>
      <div id="sbox"></div></div>
  </section>

  <section id="v-admin" class="hide">
    <div id="lock" class="card"><b>Để đó cho mẹ</b><br><label>Nhập mật khẩu</label>
      <input type="text" id="pin" inputmode="numeric"><button class="btn main" id="unlock">Mở khóa</button></div>
    <div id="panel" class="hide">
      <div class="card"><img class="ic" data-img="bow" alt=""><b>Daily Tasks</b>
        <label>Xem / sửa ngày</label><select id="aday"></select>
        <div id="atasks"></div>
        <label>Thêm việc mới</label><input type="text" id="ntask" placeholder="vd: Đọc 10 trang sách">
        <label>Nhập số phút luyện typing</label><input type="number" id="nmin" min="1">
        <label>Áp dụng cho</label><select id="ato"></select>
        <button class="btn main sm" id="addtask">+ Thêm việc</button></div>
      <div class="card"><img class="ic" data-img="icecream" alt=""><b>Bài luyện typing</b><div id="alessons"></div></div>
      <div class="card"><b id="ftitle">Thêm bài mới</b>
        <label>Tên bài</label><input type="text" id="lt">
        <label>Nội dung để con luyện typing</label><textarea id="lx" rows="4"></textarea>
        <label>Link hình nền (URL ảnh, có thể bỏ trống)</label><input type="text" id="lb">
        <label>Link nhạc (URL file mp3, có thể bỏ trống)</label><input type="text" id="lm">
        <button class="btn main" id="savel">Lưu bài</button> <button class="btn sm" id="clearl">Làm mới</button></div>
      <div class="card"><b>Cài đặt</b><br>
        <label>Tên hiển thị</label><input type="text" id="sname">
        <label>Đổi mật khẩu</label><input type="text" id="spin">
        <button class="btn main sm" id="ssave">Lưu cài đặt</button><hr style="border:0;border-top:2px dashed var(--line);margin:14px 0">
        <button class="btn sm" id="exp">⬇ Sao lưu dữ liệu</button>
        <label class="btn sm" style="display:inline-block">⬆ Khôi phục<input type="file" id="imp" accept=".json" hidden></label>
        <button class="btn sm" id="lockbtn">Khóa lại</button></div>
    </div>
  </section>
</div>

const DEF={name:'Bắp Học Bài Nè',pin:'1234',
 sched:{1:weekday(),2:weekday(),3:weekday(),4:weekday(),5:weekday(),
  6:[mk('bee','Làm Beehive online'),mk('type','Luyện typing 30 phút',30),mk('fly','Luyện thi Flyers')],
  0:[mk('vio','Vioedu'),mk('ioe','IOE'),mk('type','Luyện typing 30 phút',30),mk('fly','Luyện thi Flyers')]},
 lessons:[{id:'l1',title:'Bài mẫu: Lời chào',text:'Chào buổi sáng! Hôm nay con sẽ học thật vui và thật chăm chỉ.',bg:'bg',music:''}],
 checks:{},results:[]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(DEF));
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cloudErr=e=>{$('sync').textContent='⚠️ Chưa lưu được lên mạng: '+(e.code||e.message||e)};
function save(...keys){cache();if(window.cloud&&keys.length){const o={};keys.forEach(k=>o[k]=S[k]);window.cloud.update(o).catch(cloudErr)}}
function saveCheck(d,id,v){cache();if(window.cloud)window.cloud.updateField(['checks',d,id],v).catch(cloudErr)}
function saveResult(r){cache();if(window.cloud)window.cloud.addResult(r).catch(cloudErr)}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dayAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ds(d)};
const TODAY=ds(new Date());
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const tasksFor=date=>S.sched[parse(date).getDay()]||[];
const typedSecs=date=>S.results.filter(r=>r.date===date).reduce((a,r)=>a+r.secs,0);
const isDone=(date,t)=>t.typing?typedSecs(date)>=t.typing*60:!!(S.checks[date]||{})[t.id];
function dayPct(date){const t=tasksFor(date);return t.length?Math.round(t.filter(x=>isDone(date,x)).length/t.length*100):0}
const goalFor=date=>(tasksFor(date).find(t=>t.typing)||{typing:15}).typing;

function view(v){
  ['home','type','stats','admin'].forEach(k=>$('v-'+k).classList.toggle('hide',k!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v!=='type')leavePlay();
  if(v==='home')renderHome();if(v==='type')renderPick();if(v==='stats')renderStats();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));

/* ---------- Lịch tuần ---------- */
let wk=0,sel=TODAY;
function monday(off){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k+off*7);return d}
$('pw').onclick=()=>{wk--;sel=ds(addD(monday(wk),0));renderHome()};
$('nw').onclick=()=>{wk++;sel=ds(addD(monday(wk),0));renderHome()};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function renderHome(){
  $('title').textContent=S.name;
  $('today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
  const m=monday(wk),e=addD(m,6);
  $('wlabel').textContent=`${m.getDate()}/${m.getMonth()+1} – ${e.getDate()}/${e.getMonth()+1}`;
  let h='';
  for(let i=0;i<7;i++){const d=addD(m,i),s=ds(d),p=dayPct(s);
    h+=`<button class="day ${s===TODAY?'today':''} ${s===sel?'sel':''}" data-d="${s}"><small>${DN[d.getDay()]}</small><b>${d.getDate()}</b><div class="mini"><i style="width:${p}%"></i></div>${p===100&&s<=TODAY?'<img class="star" src="${IMG.star}" alt="">':''}</button>`}
  $('days').innerHTML=h;
  $('days').querySelectorAll('.day').forEach(b=>b.onclick=()=>{sel=b.dataset.d;renderHome()});
  renderDay();
}
function renderDay(){
  const d=parse(sel),ts=tasksFor(sel),future=sel>TODAY;
  $('dtitle').textContent=`${DFULL[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}${sel===TODAY?' (hôm nay)':''}`;
  $('list').innerHTML=ts.map(t=>{const on=isDone(sel,t);
    return t.typing
     ?`<div class="task ${on?'done':''}" data-go="1"><input type="checkbox" disabled ${on?'checked':''}><span>⌨️ ${esc(t.text)}<small>Đã luyện ${(typedSecs(sel)/60).toFixed(1)}/${t.typing} phút — bấm để vào luyện</small></span></div>`
     :`<label class="task ${on?'done':''}"><input type="checkbox" data-id="${t.id}" ${on?'checked':''} ${future?'disabled':''}><span>${esc(t.text)}</span></label>`}).join('')||'<p class="sub">Ngày này chưa có việc nào.</p>';
  $('list').querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{
    S.checks[sel]=S.checks[sel]||{};S.checks[sel][i.dataset.id]=i.checked;saveCheck(sel,i.dataset.id,i.checked);renderHome()});
  $('list').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>view('type'));
  const p=dayPct(sel);$('pbar').style.width=p+'%';
  $('pct').textContent=future?'Chưa đến ngày này':p===100?'Hoàn thành hết rồi, giỏi quá! 🌟':`Xong ${p}%`;
}

/* ---------- Luyện Typing ---------- */
function bestOf(l){
  const rs=S.results.filter(r=>r.lessonId===l.id||(!r.lessonId&&r.lesson===l.title));
  if(!rs.length)return null;
  return{n:rs.length,best:rs.reduce((a,r)=>(r.wpm>a.wpm||(r.wpm===a.wpm&&r.acc>a.acc))?r:a)};
}
function renderPick(){
  $('result').classList.add('hide');$('pick').classList.remove('hide');$('play').classList.add('hide');
  const g=goalFor(TODAY),m=typedSecs(TODAY)/60;
  $('goaltxt').textContent=g;$('tbar').style.width=Math.min(100,m/g*100)+'%';
  $('tmin').textContent=`Đã luyện ${m.toFixed(1)} / ${g} phút`;
  $('lessons').innerHTML=S.lessons.length?S.lessons.map(l=>{const p=bestOf(l);
    return `<div class="lesson ${p?'done':''}"><span>${p?'✅':'📖'} ${esc(l.title)}${p?`<small>Cao nhất: <b>${p.best.wpm}</b> từ/phút · <b>${p.best.acc}%</b> chính xác · đã luyện ${p.n} lần</small>`:''}</span><button class="btn ${p?'':'main'} sm" data-play="${l.id}">${p?'typing lại':'Bắt đầu'}</button></div>`}).join(''):'Chưa có bài nào. Nhờ ba mẹ thêm bài nhé!';
  $('lessons').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>startLesson(b.dataset.play));
}
let L,txt,started,t0,tick,errs,keys,secs,finished,prev='';
function startLesson(id){
  L=S.lessons.find(x=>x.id===id);if(!L)return;
  txt=L.text.replace(/\s+/g,' ').trim();
  $('pick').classList.add('hide');$('result').classList.add('hide');$('play').classList.remove('hide');
  const bgv=(L.bg==='bg'||L.bg==='img/bg.jpg')?IMG.bg:L.bg;$('stage').style.backgroundImage=bgv?`url("${bgv.replace(/"/g,'')}")`:'none';
  $('text').innerHTML=[...txt].map(c=>`<span>${esc(c)}</span>`).join('');
  $('inp').value='';prev='';started=false;errs=0;keys=0;secs=0;finished=false;$('clock').textContent='00:00';
  clearInterval(tick);
  const a=$('aud');if(L.music){a.src=L.music;a.volume=.5;a.play().catch(()=>{})}else{a.removeAttribute('src')}
  paint([]);$('inp').focus();
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paint(v){const sp=$('text').children,c=[...txt];
  for(let i=0;i<sp.length;i++)sp[i].className=i<v.length?(v[i]===c[i]?'ok':'bad'):(i===v.length?'cur':'');}
$('inp').addEventListener('input',()=>{
  if(finished)return;
  const v=[...$('inp').value],c=[...txt],old=[...prev];
  if(!started&&v.length){started=true;t0=Date.now();tick=setInterval(()=>{secs=Math.floor((Date.now()-t0)/1000);$('clock').textContent=fmt(secs)},250)}
  for(let i=old.length;i<v.length;i++){keys++;if(v[i]!==c[i])errs++}
  prev=v.join('');paint(v);
  if(v.length>=c.length)finish();
});
$('stage').onclick=()=>$('inp').focus();
$('stop').onclick=()=>{if(started)finish();else{leavePlay();renderPick()}};
$('back').onclick=()=>{leavePlay();renderPick()};
function leavePlay(){clearInterval(tick);$('aud').pause();prev=''}
function finish(){
  if(finished)return;finished=true;clearInterval(tick);$('aud').pause();
  secs=Math.max(1,Math.round((Date.now()-t0)/1000));
  const typed=[...$('inp').value].length,wpm=Math.round((typed/5)/(secs/60)),acc=keys?Math.round((keys-errs)/keys*100):100;
  const pb=bestOf(L),best=pb?pb.best.wpm:null;
  const rec={date:TODAY,lesson:L.title,lessonId:L.id,wpm,acc,secs,at:Date.now()};S.results.push(rec);saveResult(rec);prev='';
  $('play').classList.add('hide');$('result').classList.remove('hide');
  $('result').innerHTML=`<img class="stk" src="${IMG.star}" alt="" style="width:60px;right:12px;top:-18px"><h2 style="margin-top:0">Giỏi quá! 🎉</h2><div class="res">
   <div><b>${wpm}</b>từ/phút</div><div><b>${acc}%</b>chính xác</div><div><b>${fmt(secs)}</b>thời gian</div><div><b>${errs}</b>lần bấm sai</div></div>
   <p>${best===null?'Lần đầu Bắp làm bài này, cố lên nhé!':(wpm>best?'Nhanh hơn kỷ lục cũ rồi 🚀':'Bắp thử phá kỷ lục '+best+' từ/phút nhé!')}</p>
   <button class="btn main" id="again">Luyện typing tiếp</button> <button class="btn" id="home">Về lịch tuần</button>`;
  $('again').onclick=renderPick;$('home').onclick=()=>view('home');
}

/* ---------- Thống kê ---------- */
let period=7;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=+b.dataset.p;
  document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('main',x===b));renderStats()});
function agg(from,to){
  const days=[];for(let i=from;i>=to;i--)days.push(dayAgo(i));
  const rs=S.results.filter(r=>days.includes(r.date)),avg=k=>rs.length?Math.round(rs.reduce((a,r)=>a+r[k],0)/rs.length):0;
  return{days,rs,wpm:avg('wpm'),acc:avg('acc'),mins:Math.round(rs.reduce((a,r)=>a+r.secs,0)/60),done:Math.round(days.reduce((a,d)=>a+dayPct(d),0)/days.length)};
}
function delta(a,b,u){if(!b)return a?'<span class="up">mới bắt đầu 🌱</span>':'–';const d=a-b;return `<span class="${d>=0?'up':'down'}">${d>=0?'▲ +':'▼ '}${d}${u}</span>`}
function renderStats(){
  $('ptitle').textContent=period===7?'7 ngày gần đây':'30 ngày gần đây';
  const cur=agg(period-1,0),pre=agg(2*period-1,period);
  const dw=cur.days.map(d=>{const r=cur.rs.filter(x=>x.date===d);return r.length?Math.round(r.reduce((a,x)=>a+x.wpm,0)/r.length):0}),mx=Math.max(1,...dw);
  const lbl=period===7?'tuần trước':'tháng trước';
  $('sbox').innerHTML=`<div class="res" style="margin-top:12px">
   <div><b>${cur.wpm}</b>từ/phút<br>${delta(cur.wpm,pre.wpm,'')} so với ${lbl}</div>
   <div><b>${cur.acc}%</b>chính xác<br>${delta(cur.acc,pre.acc,'%')}</div>
   <div><b>${cur.mins}</b>phút đã <br>${delta(cur.mins,pre.mins,'')}</div>
   <div><b>${cur.done}%</b>hoàn thành việc<br>${delta(cur.done,pre.done,'%')}</div></div>
   <p style="margin-bottom:0"><small>Tốc độ typing trung bình mỗi ngày</small></p>
   <div class="cols">${dw.map((w,i)=>`<div title="${cur.days[i]}: ${w} từ/phút" style="height:${w/mx*100}%"></div>`).join('')}</div>
   <p>${cur.rs.length===0?'Chưa có bài nào trong giai đoạn này.':cur.wpm>=pre.wpm&&cur.acc>=pre.acc?'Bắp đang rất tiến bộ! 🌟':'Lúc lên lúc xuống là bình thường, cứ đều đặn mỗi ngày nhé 💪'}</p>`;
}

/* ---------- Admin ---------- */
$('aday').innerHTML=[1,2,3,4,5,6,0].map(i=>`<option value="${i}">${DFULL[i]}</option>`).join('');
$('ato').innerHTML='<option value="sel">Chỉ ngày đang chọn ở trên</option><option value="wd">Tất cả T2–T6</option><option value="all">Cả tuần</option>';
$('aday').onchange=renderAdmin;
$('unlock').onclick=()=>{if($('pin').value===S.pin){$('lock').classList.add('hide');$('panel').classList.remove('hide');renderAdmin()}else alert('Sai mã PIN')};
$('lockbtn').onclick=()=>{$('panel').classList.add('hide');$('lock').classList.remove('hide');$('pin').value=''};
let editId=null;
function renderAdmin(){
  const dd=+$('aday').value;
  $('atasks').innerHTML=(S.sched[dd]||[]).map(t=>`<div class="lesson"><span>${t.typing?'⌨️ ':''}${esc(t.text)}</span><button class="btn sm" data-dt="${t.id}">Xóa</button></div>`).join('')||'<p class="sub">Chưa có việc.</p>';
  $('atasks').querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{S.sched[dd]=S.sched[dd].filter(t=>t.id!==b.dataset.dt);save('sched');renderAdmin()});
  $('alessons').innerHTML=S.lessons.map(l=>`<div class="lesson"><span>${esc(l.title)}</span><span><button class="btn sm" data-el="${l.id}">Sửa</button> <button class="btn sm" data-dl="${l.id}">Xóa</button></span></div>`).join('');
  $('alessons').querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{const l=S.lessons.find(x=>x.id===b.dataset.el);editId=l.id;
    $('lt').value=l.title;$('lx').value=l.text;$('lb').value=l.bg;$('lm').value=l.music;$('ftitle').textContent='Sửa bài: '+l.title;$('lt').scrollIntoView({behavior:'smooth'})});
  $('alessons').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{if(confirm('Xóa bài này?')){S.lessons=S.lessons.filter(x=>x.id!==b.dataset.dl);save('lessons');renderAdmin()}});
  $('sname').value=S.name;$('spin').value='';
}
$('addtask').onclick=()=>{
  const v=$('ntask').value.trim();if(!v)return;const mn=+$('nmin').value||0,to=$('ato').value;
  const days=to==='all'?[0,1,2,3,4,5,6]:to==='wd'?[1,2,3,4,5]:[+$('aday').value];
  days.forEach(d=>{(S.sched[d]=S.sched[d]||[]).push(mn?{id:uid(),text:v,typing:mn}:{id:uid(),text:v})});
  $('ntask').value='';$('nmin').value='';save('sched');renderAdmin();
};
function clearForm(){editId=null;['lt','lx','lb','lm'].forEach(i=>$(i).value='');$('ftitle').textContent='Thêm bài mới'}
$('clearl').onclick=clearForm;
$('savel').onclick=()=>{
  const o={title:$('lt').value.trim(),text:$('lx').value.trim(),bg:$('lb').value.trim(),music:$('lm').value.trim()};
  if(!o.title||!o.text){alert('Cần có tên bài và nội dung');return}
  if(editId)Object.assign(S.lessons.find(x=>x.id===editId),o);else S.lessons.push({id:uid(),...o});
  save('lessons');clearForm();renderAdmin();
};
$('ssave').onclick=()=>{S.name=$('sname').value.trim()||DEF.name;if($('spin').value.trim())S.pin=$('spin').value.trim();save('name','pin');renderAdmin();alert('Đã lưu')};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='goc-hoc-'+TODAY+'.json';a.click()};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);cache();Promise.resolve(window.cloud?window.cloud.set(S):0).then(()=>{alert('Đã khôi phục');location.reload()}).catch(cloudErr)}catch(x){alert('File không hợp lệ')}};r.readAsText(f)};

function refresh(){
  if(!$('play').classList.contains('hide')||!$('result').classList.contains('hide')||!$('v-admin').classList.contains('hide'))return;
  if(!$('v-home').classList.contains('hide'))renderHome();
  else if(!$('v-type').classList.contains('hide'))renderPick();
  else if(!$('v-stats').classList.contains('hide'))renderStats();
}
window.getState=()=>S;
window.onCloudData=d=>{
  S=Object.assign({name:DEF.name,pin:DEF.pin,sched:DEF.sched,lessons:[],checks:{},results:[]},d);
  cache();$('sync').textContent='☁️ Đã kết nối';refresh();
};
window.onCloudError=cloudErr;
$('sync').textContent=window.FIREBASE_CONFIG?'Đang kết nối mạng...':'💾 Đang lưu trên máy (chưa nối Firebase)';
view('home');
</script>
<script type="module">
const cfg=window.FIREBASE_CONFIG;
if(cfg){
  try{
    const V='10.12.2';
    const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const db=F.getFirestore(initializeApp(cfg));
    const ref=F.doc(db,'app','data');
    window.cloud={
      update:o=>F.updateDoc(ref,o),
      updateField:(path,v)=>F.updateDoc(ref,new F.FieldPath(...path),v),
      addResult:r=>F.updateDoc(ref,'results',F.arrayUnion(r)),
      set:d=>F.setDoc(ref,d)
    };
    F.onSnapshot(ref,snap=>{
      if(!snap.exists()){F.setDoc(ref,window.getState()).catch(window.onCloudError);return}
      window.onCloudData(snap.data());
    },err=>window.onCloudError(err));
  }catch(e){window.onCloudError(e)}
}
</script>
</body>
</html>
